# ========================================================
# KONFIGURASI DATABASE PRODUKSI (POSTGRESQL)
# ========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/marketplacedb
spring.datasource.username=postgres
spring.datasource.password=postgrespassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate PostgreSQL Dialect & Validasi Skema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Nonaktifkan H2 Web Console di Production
spring.h2.console.enabled=false

# Flyway Migration tetap aktif menjalankan V1 dan V2 otomatis ke PostgreSQL
spring.flyway.enabled=true