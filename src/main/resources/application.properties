# Mengaktifkan H2 Web Console di Browser (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Konfigurasi Database SQL H2 di Memori
spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate otomatis membuatkan / mengupdate tabel SQL dari Entity Java kita
spring.jpa.hibernate.ddl-auto=update

# Tampilkan query SQL asli di terminal (Biar kita bisa melihat SELECT / INSERT yang terjadi!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

