# Profile aktif (dev = H2 in-memory, prod = Oracle container)
spring.profiles.active=prod
spring.application.name=marketplace-backend

# Mengaktifkan H2 Web Console di browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pengaturan URL Database
spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Superpower Java 21: Virtual Threads (Concurrency Ringan Mirip Goroutine di Go)
spring.threads.virtual.enabled=true

# Hibernate hanya memvalidasi struktur tabel (tidak lagi auto-create)
spring.jpa.hibernate.ddl-auto=validate

# Mengaktifkan eksekusi migrasi Flyway
spring.flyway.enabled=true

# ========================================================
# PENGATURAN OBSERVABILITAS & HEALTH CHECK (ACTUATOR)
# ========================================================
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers

# ========================================================
# FASE 15: RABBITMQ RETRY POLICY & DEAD LETTER MECHANISM
# ========================================================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ========================================================
# FASE 16: DISTRIBUTED TRACING (MICROMETER + ZIPKIN)
# ========================================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ========================================================
# FASE 17: CIRCUIT BREAKER (RESILIENCE4J)
# ========================================================
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

# ========================================================
# FASE 18: STRUCTURED LOGGING FORMAT DENGAN TRACE ID
# ========================================================
logging.pattern.level=%5p [${spring.application.name:marketplace-backend},%X{traceId:-},%X{spanId:-}]
