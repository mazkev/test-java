services:
  # 1. Oracle Database 23ai Free
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: marketplace-oracle
    restart: always
    environment:
      ORACLE_PASSWORD: oraclepassword123
      APP_USER: myuser
      APP_USER_PASSWORD: userpassword123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. Redis In-Memory Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. RabbitMQ Message Broker & Management UI
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketplace-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # Port AMQP untuk aplikasi Java
      - "15672:15672"   # Port Web Dashboard UI di browser
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 4. Aplikasi Backend Java Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: userpassword123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

volumes:
  oracle_data:
