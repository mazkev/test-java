# ========================================================
# KONFIGURASI DATABASE ORACLE
# ========================================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=myuser
spring.datasource.password=userpassword123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Dialect Otomatis Mendeteksi Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate

# Nonaktifkan H2 Web Console di Production
spring.h2.console.enabled=false

# Flyway Migration tetap aktif menjalankan V1 dan V2 otomatis ke Oracle
spring.flyway.enabled=true

# ========================================================
# DISTRIBUTED CACHING (REDIS)
# ========================================================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Time-To-Live (TTL): Cache produk otomatis kadaluarsa setelah 10 menit
spring.cache.redis.time-to-live=600000

# ========================================================
# DISTRIBUTED MESSAGE BROKER (RABBITMQ)
# ========================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
