services:
  postgres-db:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: always
    environment:
      POSTGRES_DB: marketplacedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: