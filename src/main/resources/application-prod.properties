# ========================================================
# IDENTITAS APLIKASI
# ========================================================
spring.application.name=marketplace-backend

# ========================================================
# KONFIGURASI DATABASE ORACLE
# ========================================================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=myuser
spring.datasource.password=userpassword123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate Dialect Otomatis Mendeteksi Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate

# Nonaktifkan H2 Web Console di Production
spring.h2.console.enabled=false

# Flyway Migration tetap aktif menjalankan V1 dan V2 otomatis ke Oracle
spring.flyway.enabled=true

# ========================================================
# DISTRIBUTED CACHING (REDIS)
# ========================================================
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Time-To-Live (TTL): Cache produk otomatis kadaluarsa setelah 10 menit
spring.cache.redis.time-to-live=600000

# ========================================================
# DISTRIBUTED MESSAGE BROKER (RABBITMQ)
# ========================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================================================
# FASE 15: RABBITMQ RETRY POLICY & DEAD LETTER MECHANISM
# ========================================================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ========================================================
# FASE 16: DISTRIBUTED TRACING (MICROMETER + ZIPKIN)
# ========================================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# ========================================================
# FASE 17: CIRCUIT BREAKER (RESILIENCE4J)
# ========================================================
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2

# ========================================================
# FASE 18: STRUCTURED LOGGING FORMAT DENGAN TRACE ID
# ========================================================
logging.pattern.level=%5p [${spring.application.name:marketplace-backend},%X{traceId:-},%X{spanId:-}]
