services:
  # 1. Database PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: always
    environment:
      POSTGRES_DB: marketplacedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplacedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Aplikasi Backend Java Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/marketplacedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword123
      # Konfigurasi Host Redis di dalam jaringan Docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

volumes:
  postgres_data: