# Mengaktifkan H2 Web Console di browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pengaturan URL Database
spring.datasource.url=jdbc:h2:mem:marketplacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Superpower Java 21: Virtual Threads (Concurreny Ringan Mirip Goroutine di Go)
spring.threads.virtual.enabled=true

# Hibernate hanya memvalidasi struktur tabel (tidak lagi auto-create)
spring.jpa.hibernate.ddl-auto=validate

# Mengaktifkan eksekusi migrasi Flyway
spring.flyway.enabled=true

# ========================================================
# PENGATURAN OBSERVABILITAS & HEALTH CHECK (ACTUATOR)
# ========================================================
# Menampilkan detail status kesehatan (komponen database, disk, dll)
management.endpoint.health.show-details=always

# Aktifkan probe Liveness & Readiness khusus Kubernetes
management.endpoint.health.probes.enabled=true

# Buka endpoint health, info, dan metrics
management.endpoints.web.exposure.include=health,info,metrics
